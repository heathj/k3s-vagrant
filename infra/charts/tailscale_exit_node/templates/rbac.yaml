apiVersion: v1
kind: ServiceAccount
metadata:
  name: exit-node
---
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-exit-node
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exit-node
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - tailscale-exit-node
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exit-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exit-node
subjects:
  - kind: ServiceAccount
    name: exit-node
