apiVersion: v1
kind: Service
metadata:
  name: nfs-service
spec:
  type: NodePort
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      nodePort: 30049
    - name: mountd
      port: 20048
      targetPort: 20048
      nodePort: 30048
    - name: rpcbind
      port: 111
      targetPort: 111
      nodePort: 30011
  selector:
    app: nfs-server # must match with the label of NFS pod
