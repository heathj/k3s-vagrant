apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: oidc-apiserver
spec:
  insecureSkipVerify: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oidc-jacobheath-xyz-tls
spec:
  dnsNames:
    - oidc.jacobheath.xyz
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: oidc-jacobheath-xyz-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oidc
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`oidc.jacobheath.xyz`) && (Path(`/.well-known/openid-configuration`) || Path(`/openid/v1/jwks`))
      services:
        - kind: Service
          name: kubernetes
          namespace: default
          port: 443
          scheme: https
          serversTransport: oidc-apiserver
  tls:
    secretName: oidc-jacobheath-xyz-tls
